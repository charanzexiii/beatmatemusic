<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEATMATE</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#0b0b0f;
            color:white;
        }

        /* NAVBAR */
        nav{
            height:70px;
            background:#050507;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 6%;
            position:sticky;
            top:0;
            z-index:100;
            box-shadow:0 3px 20px rgba(255,23,68,.25);
        }

        .logo{
            font-size:34px;
            font-weight:900;
            color:#ff1744;
        }

        .logo span{
            color:white;
        }

        .nav-links{
            display:flex;
            gap:20px;
        }

        .nav-links a{
            color:white;
            text-decoration:none;
            font-size:14px;
        }

        .nav-links a:hover{
            color:#ff1744;
        }

        /* HEADER */
        .music-header{
            text-align:center;
            padding:55px 20px 25px;
        }

        .music-header h1{
            font-size:46px;
            margin-bottom:10px;
        }

        .music-header span{
            color:#ff1744;
        }

        .music-header p{
            color:#aaa;
        }

        /* SEARCH */
        .music-search{
            display:flex;
            justify-content:center;
            gap:10px;
            padding:20px;
            flex-wrap:wrap;
        }

        .music-search input{
            width:70%;
            max-width:650px;
            padding:15px 22px;
            border-radius:35px;
            border:2px solid #ff1744;
            background:#15151c;
            color:white;
            outline:none;
            font-size:16px;
        }

        .music-search button{
            padding:14px 25px;
            border:none;
            border-radius:30px;
            background:#ff1744;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }

        .music-search button:hover{
            background:#e60032;
        }

        /* SONG LIST */
        .music-list{
            width:92%;
            max-width:1200px;
            margin:25px auto;
            display:flex;
            flex-direction:column;
            gap:18px;
        }

        /* SONG CARD */
        .song{
            background:#15151c;
            border-radius:20px;
            padding:16px 20px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:18px;
            border:1px solid #222;
            transition:.3s;
        }

        .song:hover{
            transform:translateY(-3px);
            border-color:#ff1744;
            box-shadow:0 8px 25px rgba(255,23,68,.25);
        }

        .song-left{
            display:flex;
            align-items:center;
            gap:16px;
            flex:1;
        }

        .song img{
            width:95px;
            height:95px;
            object-fit:cover;
            border-radius:14px;
        }

        .song-info h3{
            font-size:24px;
            margin-bottom:6px;
        }

        .song-info p{
            color:#aaa;
            font-size:15px;
        }

        /* PLAY BUTTON */
        .play-btn{
            width:64px;
            height:64px;
            border-radius:50%;
            border:none;
            background:#ff1744;
            color:white;
            font-size:28px;
            cursor:pointer;
            flex-shrink:0;
            transition:.3s;
        }

        .play-btn:hover{
            transform:scale(1.08);
            background:#ff2f5a;
        }

        /* AUDIO CONTROLS */
        .audio-controls{
            display:none;
            width:100%;
            padding-top:14px;
            border-top:1px solid #2a2a33;
            flex-direction:column;
            gap:12px;
        }

        .audio-controls.show{
            display:flex;
        }

        audio{
            width:100%;
            height:48px;
        }

        .download-btn{
            display:inline-block;
            width:max-content;
            padding:10px 22px;
            border-radius:25px;
            background:#ff1744;
            color:white;
            text-decoration:none;
            font-weight:bold;
        }

        .download-btn:hover{
            background:#e60032;
        }

        /* PAGINATION */
        .pagination-container{
            width:92%;
            max-width:1200px;
            margin:35px auto 20px;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-wrap:wrap;
            gap:10px;
        }

        .pagination-container button{
            min-width:54px;
            height:54px;
            padding:0 16px;
            border:1px solid #333;
            border-radius:10px;
            background:#15151c;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        .pagination-container button:hover{
            background:#ff1744;
            border-color:#ff1744;
        }

        .pagination-container button.active-page{
            background:#050507;
            border-color:#ff1744;
            box-shadow:0 0 15px rgba(255,23,68,.5);
        }

        .pagination-container button.next-btn{
            min-width:120px;
            padding:0 26px;
        }

        /* FOOTER */
        footer{
            margin-top:40px;
            padding:30px;
            text-align:center;
            background:#050507;
            color:#777;
        }

        footer strong{
            color:#ff1744;
        }

        /* MOBILE */
        @media(max-width:700px){
            .music-header h1{
                font-size:34px;
            }

            .music-search input{
                width:100%;
            }

            .song{
                padding:14px;
            }

            .song img{
                width:78px;
                height:78px;
            }

            .song-info h3{
                font-size:18px;
            }

            .play-btn{
                width:50px;
                height:50px;
                font-size:22px;
            }

            .pagination-container button{
                min-width:42px;
                height:42px;
                font-size:13px;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">BEAT<span>MATE</span></div>

    <div class="nav-links">
        <a href="#">🏠 Home</a>
        <a href="#">📞 Contact</a>
        <a href="#">📱 Social</a>
    </div>
</nav>

<section class="music-header">
    <h1>🎵 <span>Music</span> Collection</h1>
    <p>Listen to your favourite movie songs</p>
</section>

<div class="music-search">
    <input type="text" id="songSearch" placeholder="🔍 Search songs...">
    <button onclick="searchSongs()">Search</button>
</div>

<div class="music-list" id="musicList"></div>

<div class="pagination-container" id="paginationContainer"></div>

<footer>
    <p>© 2026 <strong>BEATMATE</strong></p>
    <p>Made with ❤️</p>
</footer>

<script>
const songsData = [
    {title:"Dheema Song",artist:"Telugu • Melody",img:"dhima.jpeg",src:"telugu/dheema.mp3"},
    {title:"Soorede",artist:"Telugu • Action",img:"surii.jpg",src:"telugu/soorede.mp3"},
    {title:"Gehra Hua",artist:"Hindi • Romantic",img:"g.jpeg",src:"hindi/gehra.mp3"},
    {title:"Minnalva",artist:"Malayalam • Romantic",img:"JJ.jpeg",src:"malayalam/minnalva.mp3"},
    {title:"Pavazha Malli",artist:"Tamil • Melody",img:"Pava.jpeg",src:"tamil/pavazha.mp3"},
    {title:"Mehabooba",artist:"Kannada • Romantic",img:"Meh.jpg",src:"kannada/mehabooba.mp3"},
    {title:"Tum Hi Ho",artist:"Hindi • Melody",img:"g.jpeg",src:"hindi/tumhiho.mp3"},
    {title:"Zinda",artist:"Hindi • Action",img:"surii.jpg",src:"hindi/zinda.mp3"},
    {title:"Vellipoma",artist:"Telugu • Melody",img:"dhima.jpeg",src:"telugu/vellipoma.mp3"},
    {title:"Mazha",artist:"Malayalam • Melody",img:"JJ.jpeg",src:"malayalam/mazha.mp3"},
    {title:"Kadhal",artist:"Tamil • Romantic",img:"Pava.jpeg",src:"tamil/kadhal.mp3"},
    {title:"Ninnu",artist:"Kannada • Melody",img:"Meh.jpg",src:"kannada/ninnu.mp3"}
];

let currentPage = 1;
const songsPerPage = 8;
let filteredSongs = [...songsData];

const musicList = document.getElementById("musicList");
const paginationContainer = document.getElementById("paginationContainer");

function renderSongs(){
    const start = (currentPage - 1) * songsPerPage;
    const end = start + songsPerPage;
    const pageSongs = filteredSongs.slice(start, end);

    musicList.innerHTML = "";

    pageSongs.forEach((song,index)=>{
        const realIndex = start + index;

        const card = document.createElement("div");
        card.className = "song";

        card.innerHTML = `
            <div class="song-left">
                <img src="${song.img}" alt="${song.title}">

                <div class="song-info">
                    <h3>${song.title}</h3>
                    <p>${song.artist}</p>
                </div>
            </div>

            <button class="play-btn" onclick="togglePlay(${realIndex}, this)">▶</button>
        `;

        musicList.appendChild(card);
    });

    renderPagination();
}

function renderPagination(){
    const totalPages = Math.ceil(filteredSongs.length / songsPerPage);

    paginationContainer.innerHTML = "";

    if(totalPages <= 1) return;

    const prevBtn = document.createElement("button");
    prevBtn.className = "next-btn";
    prevBtn.textContent = "Previous";
    prevBtn.disabled = currentPage === 1;
    prevBtn.onclick = () => {
        currentPage--;
        renderSongs();
    };
    paginationContainer.appendChild(prevBtn);

    for(let i=1; i<=totalPages; i++){
        const btn = document.createElement("button");
        btn.textContent = i;

        if(i === currentPage){
            btn.classList.add("active-page");
        }

        btn.onclick = () => {
            currentPage = i;
            renderSongs();
        };

        paginationContainer.appendChild(btn);
    }

    const nextBtn = document.createElement("button");
    nextBtn.className = "next-btn";
    nextBtn.textContent = "Next »";
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.onclick = () => {
        currentPage++;
        renderSongs();
    };
    paginationContainer.appendChild(nextBtn);
}

function searchSongs(){
    const value = document.getElementById("songSearch").value.toLowerCase();

    filteredSongs = songsData.filter(song =>
        song.title.toLowerCase().includes(value) ||
        song.artist.toLowerCase().includes(value)
    );

    currentPage = 1;
    renderSongs();
}

document.getElementById("songSearch").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        searchSongs();
    }
});

function togglePlay(index, button){
    alert("Play: " + songsData[index].title + "\\n\\nAdd your MP3 file paths in songsData to enable audio playback.");
}

renderSongs();
</script>

</body>
</html>
